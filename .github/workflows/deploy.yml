name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image (CI verification)
        run: |
          docker build \
            -t mern-backend:latest \
            -f Dockerfile.backend \
            .

      - name: Build frontend image (CI verification)
        run: |
          docker build \
            -t mern-frontend:latest \
            -f Dockerfile.frontend \
            .

      - name: SSH to EC2 and deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script_stop: true
          script: |
            set -euo pipefail

            echo "🔹 Ensuring git..."
            if ! command -v git >/dev/null 2>&1; then
              if command -v yum >/dev/null 2>&1; then
                sudo yum update -y
                sudo yum install -y git
              elif command -v dnf >/dev/null 2>&1; then
                sudo dnf install -y git
              elif command -v apt-get >/dev/null 2>&1; then
                sudo apt-get update -y
                sudo apt-get install -y git
              fi
            fi

            echo "🔹 Ensuring Docker..."
            if ! command -v docker >/dev/null 2>&1; then
              curl -fsSL https://get.docker.com | sh
              sudo systemctl enable docker || true
              sudo systemctl start docker || true
            fi

            echo "🔹 Ensuring Docker Compose plugin..."
            if ! docker compose version >/dev/null 2>&1; then
              sudo mkdir -p /usr/local/lib/docker/cli-plugins
              sudo curl -SL "https://github.com/docker/compose/releases/latest/download/docker-compose-linux-$(uname -m)" \
                -o /usr/local/lib/docker/cli-plugins/docker-compose
              sudo chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
            fi

            APP_DIR=~/dockermy

            echo "🔹 Pulling latest code..."
            if [ -d "$APP_DIR/.git" ]; then
              cd "$APP_DIR"
              git fetch --all --prune
              git reset --hard origin/main
            else
              git clone "https://github.com/${{ github.repository }}.git" "$APP_DIR"
              cd "$APP_DIR"
            fi

            # Optionally create an .env from GitHub Secrets (recommended)
            if [ -n "${{ secrets.MONGO_URI }}" ]; then
              echo "🔹 Writing .env from secrets..."
              cat > .env <<'EOF'
MONGO_URI=${{ secrets.MONGO_URI }}
PORT=5000
EOF
              USE_ENV_FILE=1
            else
              USE_ENV_FILE=0
            fi

            echo "🔹 Rebuilding containers..."
            if [ "$USE_ENV_FILE" = "1" ]; then
              sudo docker compose --env-file .env up -d --build
            else
              sudo docker compose up -d --build
            fi

            echo "🔹 Cleaning up old images..."
            sudo docker image prune -f || true


