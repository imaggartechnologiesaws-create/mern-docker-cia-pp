name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image (CI verification)
        run: |
          docker build \
            -t mern-backend:latest \
            -f Dockerfile.backend \
            .

      - name: Build frontend image (CI verification)
        run: |
          docker build \
            -t mern-frontend:latest \
            -f Dockerfile.frontend \
            .

      - name: SSH to EC2 and deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script_stop: true
          script: |
            set -euo pipefail

            # Ensure git and docker compose are available
            if ! command -v git >/dev/null 2>&1; then
              sudo apt-get update -y
              sudo apt-get install -y git
            fi

            if ! docker compose version >/dev/null 2>&1; then
              # Install Docker if missing, and ensure compose v2 is present
              if ! command -v docker >/dev/null 2>&1; then
                curl -fsSL https://get.docker.com | sh
                sudo usermod -aG docker "$USER" || true
              fi
            fi

            APP_DIR=~/dockermy

            # Clone or update repo
            if [ -d "$APP_DIR/.git" ]; then
              git -C "$APP_DIR" fetch --all --prune
              git -C "$APP_DIR" checkout main
              git -C "$APP_DIR" pull --rebase --autostash
            else
              git clone --depth=1 "https://github.com/${{ github.repository }}.git" "$APP_DIR"
            fi

            cd "$APP_DIR"

            # Bring up stack with Docker Compose (build on server)
            docker compose -f docker-compose.yml up -d --build

            # Optional cleanup of dangling images
            docker image prune -f || true


